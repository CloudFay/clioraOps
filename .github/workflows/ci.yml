name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov flake8 black mypy

      - name: Run critical Flake8 checks
        run: |
          flake8 clioraOps_cli \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Report additional Flake8 findings
        run: |
          flake8 clioraOps_cli \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Check formatting with Black
        continue-on-error: true
        run: black --check clioraOps_cli tests

      - name: Check types with Mypy
        continue-on-error: true
        run: mypy clioraOps_cli --ignore-missing-imports

      - name: Run tests and generate coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=clioraOps_cli \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate distribution
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  security-scan:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Capture resolved project dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/safety-target"
          python -m pip freeze \
            | grep -vE '^-e ' \
            > "$RUNNER_TEMP/safety-target/requirements.txt"

          test -s "$RUNNER_TEMP/safety-target/requirements.txt"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan source code with Bandit
        run: |
          bandit -r clioraOps_cli -ll --exit-zero \
            -f json -o bandit-report.json
          python -m json.tool bandit-report.json > /dev/null

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Set up isolated Safety environment
        run: |
          python -m venv "$RUNNER_TEMP/safety-venv"
          "$RUNNER_TEMP/safety-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/safety-venv/bin/python" -m pip install safety

      - name: Scan dependencies with Safety
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          if [ -z "$SAFETY_API_KEY" ]; then
            echo "::error::SAFETY_API_KEY is not configured."
            exit 1
          fi

          "$RUNNER_TEMP/safety-venv/bin/safety" \
            --stage cicd scan \
            --target "$RUNNER_TEMP/safety-target" \
            --output json \
            --save-as json safety-report.json

          python -m json.tool safety-report.json > /dev/null

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safety-dependency-report
          path: safety-report.json
          if-no-files-found: warn
          retention-days: 7
