name: Release Management

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.3.2)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail before modifying files if the workflow was dispatched
      # from a branch other than main.
      - name: Require main branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_BRANCH" != "main" ]]; then
            echo "::error::Releases must be dispatched from main. Current branch: $RELEASE_BRANCH"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version. Use MAJOR.MINOR.PATCH, e.g. 0.3.2"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "::error::Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update version in setup.py
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("setup.py")
          content = path.read_text(encoding="utf-8")

          pattern = r'''(?m)^(\s*version\s*=\s*["'])[^"']+(["'])'''

          updated, count = re.subn(
              pattern,
              lambda match: (
                  match.group(1)
                  + os.environ["RELEASE_VERSION"]
                  + match.group(2)
              ),
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not identify a version assignment in setup.py"
              )

          path.write_text(updated, encoding="utf-8")
          print(
              f"Updated package version to "
              f"{os.environ['RELEASE_VERSION']}"
          )
          PY

      - name: Create CHANGELOG entry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")

          if changelog_path.exists():
              existing = changelog_path.read_text(encoding="utf-8")
          else:
              existing = (
                  "# Changelog\n\n"
                  "All notable changes to this project will be documented "
                  "in this file.\n"
              )

          lines = existing.splitlines()

          if not lines or lines[0].strip() != "# Changelog":
              raise SystemExit(
                  "CHANGELOG.md must start with '# Changelog'"
              )

          version = os.environ["RELEASE_VERSION"]
          release_type = os.environ["RELEASE_TYPE"].capitalize()
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          if any(
              line.strip() == f"## [{version}]"
              or line.strip().startswith(f"## [{version}] -")
              for line in lines
          ):
              raise SystemExit(
                  f"CHANGELOG.md already contains version {version}"
              )

          # Preserve the introduction and insert the new release
          # before the existing release history.
          release_index = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.startswith("## [")
              ),
              len(lines),
          )

          header = "\n".join(lines[:release_index]).rstrip()
          body = "\n".join(lines[release_index:]).strip()

          entry = (
              f"## [{version}] - {today}\n\n"
              f"### {release_type}\n"
              f"- Release version {version}\n"
          )

          content = header + "\n\n" + entry

          if body:
              content += "\n\n" + body

          content += "\n"

          changelog_path.write_text(content, encoding="utf-8")
          print(f"Created CHANGELOG entry for {version}")
          PY

      - name: Verify package metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path("setup.py").read_text(encoding="utf-8")

          match = re.search(
              r'''(?m)^\s*version\s*=\s*["']([^"']+)["']''',
              content,
          )

          if not match:
              raise SystemExit(
                  "Could not find the version assignment in setup.py"
              )

          if match.group(1) != os.environ["RELEASE_VERSION"]:
              raise SystemExit(
                  "setup.py version does not match requested release"
              )

          print(f"Verified package version: {match.group(1)}")
          PY

      - name: Commit release changes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git add setup.py CHANGELOG.md
          git commit -m "chore: bump version to ${RELEASE_VERSION}"

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -a "v${RELEASE_VERSION}" \
            -m "Release version ${RELEASE_VERSION}"

          git push origin \
            "HEAD:refs/heads/${RELEASE_BRANCH}" \
            "refs/tags/v${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
